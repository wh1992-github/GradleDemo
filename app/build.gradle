import java.text.SimpleDateFormat

apply plugin: 'com.android.application'

//从androidManifest.xml中获取版本号
def getVersionNameFromManifest() {
    return android.defaultConfig.versionName
}

android {
    namespace 'com.example.wh.myapplication'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.wh.myapplication"
        minSdkVersion 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        flavorDimensions "versionName"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    sourceSets {
        main {
            java.srcDirs = ["src/main/java"]
            jniLibs.srcDirs = ['src/main/libs']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    productFlavors {
        //多渠道打包
        common {
            applicationId "com.example.wh.myapplication.common"
            manifestPlaceholders = [package_name     : "com.example.wh.myapplication.common",
                                    APP_NAME         : "@string/app_name",
                                    APP_CHANNEL_VALUE: "commonChannel"]
            versionName "common"
            versionCode Integer.valueOf(getTime())
            //library多渠道编译:重新定义此属性，动态的获取lib module的当前flavor
            missingDimensionStrategy "versionLib", "commonLib"
        }
        normal {
            applicationId "com.example.wh.myapplication.normal"
            manifestPlaceholders = [package_name     : "com.example.wh.myapplication.normal",
                                    APP_NAME         : "@string/app_name",
                                    APP_CHANNEL_VALUE: "normalChannel"]
            versionName "normal"
            versionCode Integer.valueOf(getTime())
            //library多渠道编译:重新定义此属性，动态的获取lib module的当前flavor
            missingDimensionStrategy "versionLib", "normalLib"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}

//获取时间戳
static def getTime() {
    return new SimpleDateFormat("yyyyMMdd").format(new Date())
//   return new Date().format("yyyyMMddHHmmss")
}

static def releaseTime() {
    return new Date().format("yyyyMMdd-HHmmss", TimeZone.getTimeZone("Asia/Shanghai"))
}

// 导出所有 BuildVariant 的 APK。
def apkExportDir = file('targetApk')

task exportApk(type: Copy) {
    into(apkExportDir)
    outputs.upToDateWhen { false }

    // 只在执行 exportApk 时清理，避免其他 Gradle 任务误删已有产物。
    doFirst {
        delete(apkExportDir)
    }
}

android.applicationVariants.all { variant ->
    def artifactName = "${variant.versionName}_${variant.versionCode}_${variant.name}_${android.defaultConfig.versionName}_${releaseTime()}"

    exportApk.dependsOn(variant.assembleProvider)
    variant.outputs.each { output ->
        exportApk.from(output.outputFile) {
            rename { "${artifactName}.apk" }
        }
    }
}

//delete
task deleteDir(type: Delete) {
    delete "build/"
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation project(':mylibrary')
}

//Task的第一种声明方法
task mTask1 {
    doLast {
        println "Hello，这是我声明的Task1"
    }
}
//Task的第二种声明方法
task(mTask2) {
    doLast {
        println "Hello，这是我声明的Task2"
    }
}
//Task的第三种声明方法
task('mTask3') {
    doLast {
        println "Hello，这是我声明的Task3"
    }
}
