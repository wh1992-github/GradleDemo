import java.text.SimpleDateFormat

apply plugin: 'com.android.library'

android {
    namespace 'com.example.mylibrary'
    compileSdk 34
    defaultConfig {
        minSdkVersion 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        flavorDimensions "versionLib"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    productFlavors {
        commonLib {}
        normalLib {}
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}

def releaseTime() {
    return new Date().format("yyyyMMdd-HHmmss", TimeZone.getTimeZone("Asia/Shanghai"))
}

//delete
task deleteDir(type: Delete) {
    delete "build/"
}

// 导出所有 BuildVariant 的 JAR 和 AAR。
def exportDir = file('targetJar')

task exportJar(type: Copy) {
    into(exportDir)
    outputs.upToDateWhen { false }

    // 只在执行 exportJar 时清理，避免配置其他 Gradle 任务时误删已有产物。
    doFirst {
        delete(exportDir)
    }
}

android.libraryVariants.all { variant ->
    def variantName = variant.name
    def artifactName = "${variantName}_${android.defaultConfig.versionName}_${releaseTime()}"
    def aarName = "${project.name}-${variant.flavorName}-${variant.buildType.name}.aar"

    exportJar.dependsOn(variant.assembleProvider)

    exportJar.from("$buildDir/intermediates/aar_main_jar/${variantName}/classes.jar") {
        rename { "${artifactName}.jar" }
    }
    exportJar.from("$buildDir/outputs/aar/${aarName}") {
        rename { "${artifactName}.aar" }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //noinspection GradleCompatible,GradleCompatible
    implementation 'com.android.support:appcompat-v7:28.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
